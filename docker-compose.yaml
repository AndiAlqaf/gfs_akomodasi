version: "3.9"

services:
  # ============================================================
  # Database MySQL 8.0
  # ============================================================
  db:
    image: mysql:8.0
    container_name: gfs-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Init SQL: akan dijalankan saat pertama kali DB dibuat
      - ./backend/database/sql_dumps/gfs_akomodasi_new.sql:/docker-entrypoint-initdb.d/01-schema-data.sql:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # Backend PHP Built-in Server
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gfs-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 31145
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-*}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_CHARSET: utf8mb4
    volumes:
      # Persist uploads
      - ./backend/uploads:/var/www/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  # ============================================================
  # Frontend React/Vite (build + Nginx static server)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # API URL yang diakses dari browser — gunakan domain publik Anda
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: gfs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app_net

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: gfs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

  # ============================================================
  # phpMyAdmin (opsional — akses via Cloudflare tunnel / lokal)
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gfs-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  # ============================================================
  # Cloudflare Tunnel
  # ============================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gfs-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
    driver: local
