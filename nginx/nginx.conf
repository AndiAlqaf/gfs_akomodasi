user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    # Jangan bocorkan versi nginx
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        # --------------------------------------------------
        # API: FastCGI ke PHP-FPM (backend:9000)
        # Sebelumnya PHP built-in server di port 31145 — single-threaded,
        # tanpa hardening, dan tidak untuk produksi.
        # --------------------------------------------------
        location /api/ {
            fastcgi_pass   backend:9000;
            include        fastcgi_params;

            # Front controller: semua /api/* masuk ke index.php
            fastcgi_param  SCRIPT_FILENAME  /var/www/backend/index.php;
            fastcgi_param  SCRIPT_NAME      /index.php;
            fastcgi_param  DOCUMENT_ROOT    /var/www/backend;

            # Info hop asli dari Cloudflare (dulu di-set sebagai proxy header)
            fastcgi_param  HTTP_HOST                $host;
            fastcgi_param  HTTP_X_FORWARDED_FOR     $proxy_add_x_forwarded_for;
            fastcgi_param  HTTP_X_FORWARDED_PROTO   $scheme;

            fastcgi_connect_timeout 10s;
            fastcgi_read_timeout    120s;
            fastcgi_send_timeout    120s;
            fastcgi_buffer_size     32k;
            fastcgi_buffers         16 32k;
            fastcgi_busy_buffers_size 64k;
        }

        # --------------------------------------------------
        # Frontend: proxy ke React/Nginx container (port 80)
        # --------------------------------------------------
        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
